name: tick
# Hourly scheduler for nudges + daily synthesis. Works on any Vercel plan.
# Secrets: CRON_SECRET (same value as the Vercel env var). Variables: APP_URL.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: call /api/cron/tick
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then echo "APP_URL variable not set"; exit 1; fi
          curl -fsS --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ vars.APP_URL }}/api/cron/tick"
